<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SAT Nexus — Private Access</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #03030f; --text: #f1f5f9; --muted: #94a3b8; --rose: #fb7185;
      --brand: linear-gradient(135deg, #818cf8 0%, #a78bfa 50%, #22d3ee 100%);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif;
      background-image:
        radial-gradient(600px 400px at 15% 10%, rgba(129,140,248,.18), transparent 70%),
        radial-gradient(500px 400px at 90% 90%, rgba(34,211,238,.12), transparent 70%);
    }
    .card {
      width: 100%; max-width: 400px; padding: 40px 32px; text-align: center;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px; backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
    }
    .mark { font-size: 2.2rem; margin-bottom: 14px; }
    h1 { font-family: Syne, sans-serif; font-weight: 800; font-size: 1.6rem; letter-spacing: -.02em; }
    h1 span { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); font-size: .9rem; margin: 8px 0 26px; line-height: 1.5; }
    input {
      width: 100%; padding: 14px 16px; border-radius: 12px; font: inherit; font-size: 1rem;
      letter-spacing: .08em; text-align: center; color: var(--text);
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129,140,248,.25); }
    button {
      width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
      font: inherit; font-weight: 600; color: #fff; background: var(--brand);
      transition: transform .15s, opacity .2s;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .6; cursor: default; transform: none; }
    .err { min-height: 20px; margin-top: 14px; font-size: .84rem; color: var(--rose); }
    .shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="mark">🎯</div>
    <h1>SAT <span>Nexus</span></h1>
    <p>This is a private workspace.<br />Enter your access code to continue.</p>
    <form id="form" autocomplete="off">
      <input id="code" type="password" placeholder="Access code" autofocus required
             autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Access code" />
      <button id="btn" type="submit">Unlock</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('form'), code = document.getElementById('code'),
          btn = document.getElementById('btn'), err = document.getElementById('err'),
          card = document.getElementById('card');

    // Only same-site relative paths are allowed as a post-login destination.
    function safeNext() {
      const n = new URLSearchParams(location.search).get('next') || '';
      return n.startsWith('/') && !n.startsWith('//') && !n.startsWith('/\\') ? n : '/index.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = ''; btn.disabled = true; btn.textContent = 'Checking…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code.value })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) { location.replace(safeNext()); return; }
        err.textContent = data.error || 'Something went wrong.';
      } catch { err.textContent = 'Network error. Try again.'; }
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      code.value = ''; code.focus();
      btn.disabled = false; btn.textContent = 'Unlock';
    });
  </script>
</body>
</html>
